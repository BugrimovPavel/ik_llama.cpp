name: Build ik_llama Windows CUDA sm120

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA 12.8
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'

      - name: Configure
        shell: cmd
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DGGML_CUDA=ON
          -DCMAKE_CUDA_ARCHITECTURES=120
          -DGGML_IQK_FA_ALL_QUANTS=ON
          -DLLAMA_CURL=OFF

      - name: Build
        shell: cmd
        run: cmake --build build --config Release -j 2

      - name: Collect
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact

          Copy-Item build\bin\Release\*.exe artifact\
          Copy-Item build\bin\Release\*.dll artifact\ -ErrorAction SilentlyContinue

          $cuda = $env:CUDA_PATH
          Copy-Item "$cuda\bin\cudart64*.dll" artifact\ -ErrorAction SilentlyContinue
          Copy-Item "$cuda\bin\cublas64*.dll" artifact\ -ErrorAction SilentlyContinue
          Copy-Item "$cuda\bin\cublasLt64*.dll" artifact\ -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ik-llama-windows-cuda-sm120
          path: artifact
